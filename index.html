<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="header-row">
      <div class="header-left">
        <img src="https://cdn-icons-png.flaticon.com/512/6840/6840478.png">
        <button class="location-button">
          <!--
category: Map
tags: [navigation, location, travel, pin, position, marker]
version: "1.0"
unicode: "eae8"
-->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
            <path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z" />
          </svg>
        </button>
        <p class="location city">Tbilisi</p>
        <!--
tags: [move, next, swipe, bottom]
category: Arrows
version: "1.0"
unicode: "ea5f"
-->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6l6 -6" />
        </svg>

      </div>
      <div class="header-right">
        <nav>
          <a href="#">Courses</a>
          <a href="#" class="button-accent">Log in</a>
        </nav>
      </div>
  </header>


  <main>

    <section class="hero">
      <h1>Popular courses</h1>
    </section>
    <div class="full-main">

      <section class="courses">
        <div class="course-card">
          <img src="https://images.seeklogo.com/logo-png/20/1/html5-logo-png_seeklogo-206834.png" alt="HTML">
          <h3>HTML</h3>
          <p>25$</p>
          <button>Buy Now</button>
        </div>
        <div class="course-card">
          <img src="https://images.seeklogo.com/logo-png/18/1/css3-logo-png_seeklogo-186678.png" alt="CSS">
          <h3>CSS</h3>
          <p>35$</p>
          <button>Buy Now</button>
        </div>
        <div class="course-card">
          <img src="https://logos-world.net/wp-content/uploads/2023/02/JavaScript-Logo.png" alt="JAVASCRIPT">
          <h3>JAVASCRIPT</h3>
          <p>40$</p>
          <button>Buy Now</button>
        </div>
        <div class="course-card">
          <img src="https://images.icon-icons.com/2415/PNG/512/react_original_wordmark_logo_icon_146375.png"
            alt="REACT">
          <h3>REACT</h3>
          <p>50$</p>
          <button>Buy Now</button>
        </div>
        <div class="course-card">
          <img src="https://pngimg.com/uploads/php/php_PNG10.png" alt="PHP">
          <h3>PHP</h3>
          <p>45$</p>
          <button>Buy Now</button>
        </div>
        <div class="course-card">
          <img src="https://cdn-icons-png.flaticon.com/512/17793/17793868.png" alt="UI/UX">
          <h3>UI/UX</h3>
          <p>70$</p>
          <button>Buy Now</button>
        </div>
      </section>
      <div class="button">
        <button class="b">View All</button>
      </div>
    </div>

  </main>

  <footer>
    <div class="footer-row">
      <div class="footer-left">
        <img src="https://cdn-icons-png.flaticon.com/512/10329/10329631.png" alt="footer">
      </div>

      <div class="footer-right">
        <h3>Contact Us</h3>
        <p>Email: info@course.ge</p>
        <p>Phone: +995 555 262 262</p>
        <p>Adress: Tbilisi, Georgia</p>
      </div>

    </div>
  </footer>

</body>

</html>
